version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sentry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentry
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
    ports:
      - "5432:5432"
    volumes:
      - sentry_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: sentry-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  sentry_pgdata:
